<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EAST &amp; SOUL — AI Mobile Camera</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --surface-hover: #1e293b;
      --border: rgba(255, 255, 255, 0.12);
      --ink: #ffffff;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #10b981;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background-color: var(--bg) !important;
      color: var(--ink);
      font-family: var(--font);
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(9, 13, 22, 0.95);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    .brand-badge {
      background: #ffffff;
      color: #000000;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      color: #e2e8f0;
      font-family: monospace;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* MAIN VIEWFINDER / CAMERA AREA */
    .viewfinder-wrap {
      flex: 1;
      position: relative;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #preview-canvas {
      display: none;
    }

    /* FALLBACK DIRECT CAPTURE VIEW (khi trình duyệt chặn live video qua HTTP) */
    .fallback-capture-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      width: 100%;
      height: 100%;
    }

    .camera-circle-trigger {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: 4px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
      transition: transform 0.15s ease;
      margin-bottom: 16px;
    }

    .camera-circle-trigger:active {
      transform: scale(0.92);
    }

    .fallback-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .fallback-desc {
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 280px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .camera-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #e2e8f0;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }

    /* CONTROLS BAR */
    .controls-bar {
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 12px));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    /* Quick Preset chips */
    .preset-chips-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .preset-chip-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .preset-chip-btn:active {
      background: #ffffff;
      color: #000000;
    }

    .shutter-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 16px;
    }

    .side-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .side-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .shutter-btn-main {
      flex: 1;
      max-width: 200px;
      height: 52px;
      border-radius: 26px;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      color: #090d16;
      font-weight: 700;
      font-size: 0.95rem;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .shutter-btn-main:active {
      transform: scale(0.96);
      background: #cbd5e1;
    }

    /* PHOTO REVIEW OVERLAY */
    .review-overlay {
      position: absolute;
      inset: 0;
      background: #090d16;
      z-index: 50;
      display: none;
      flex-direction: column;
    }

    .review-top {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .review-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .review-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      object-fit: contain;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .review-bottom {
      padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn-send {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-send:active {
      transform: scale(0.98);
    }

    .btn-retake {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* SUCCESS SCREEN */
    .success-screen {
      position: absolute;
      inset: 0;
      background: #090d16;
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .success-icon-wrap {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--accent-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
      margin-bottom: 20px;
    }

    .success-screen h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .success-screen p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 24px;
    }
  </style>
</head>

<body>
  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-badge">E&amp;S</span>
      <span>CAMERA</span>
    </div>
    <div class="session-badge">
      <span class="dot-live"></span>
      <span id="session-display">Session: —</span>
    </div>
  </header>

  <!-- VIEWFINDER / CAMERA AREA -->
  <main class="viewfinder-wrap">
    <video id="video-stream" autoplay playsinline muted></video>
    <canvas id="preview-canvas"></canvas>


    <div class="camera-hint" id="camera-hint">Căn chỉnh trang phục vào giữa khung hình</div>
  </main>

  <!-- CONTROLS & SHUTTER -->
  <footer class="controls-bar">

    <!-- Hidden file inputs -->
    <input type="file" id="native-camera-input" accept="image/*" capture="environment" style="display:none"
      onchange="handleFileSelected(event)">
    <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleFileSelected(event)">

    <div class="shutter-row">
      <!-- Thư viện ảnh -->
      <button type="button" class="side-btn" onclick="triggerGallery()" title="Chọn từ thư viện">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>

      <!-- Main Shutter Button -->
      <button type="button" class="shutter-btn-main" onclick="onMainShutterClick()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
        </svg>
        Chụp ảnh
      </button>

      <!-- Đổi camera -->
      <button type="button" class="side-btn" onclick="switchCameraFacing()" title="Đổi camera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16v5h-5"></path>
          <path d="M4 8V3h5"></path>
          <path d="M20 8A9 9 0 0 0 4.5 4.5L4 8"></path>
          <path d="M4 16a9 9 0 0 0 15.5 3.5l.5-3.5"></path>
        </svg>
      </button>
    </div>
  </footer>

  <!-- REVIEW OVERLAY -->
  <div class="review-overlay" id="review-overlay">
    <div class="review-top">
      <strong>Xác nhận ảnh chụp</strong>
      <span style="font-size: 0.8rem; color: #94a3b8;">Sẵn sàng gửi lên trang web</span>
    </div>
    <div class="review-img-wrap">
      <img id="review-img" src="" alt="Ảnh chụp">
    </div>
    <div class="review-bottom">
      <button type="button" class="btn btn-send" id="btn-send-to-pc" onclick="sendPhotoToDesktop()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Gửi ảnh lên màn hình máy tính
      </button>
      <button type="button" class="btn btn-retake" onclick="retakePhoto()">Chụp lại</button>
    </div>
  </div>

  <!-- SUCCESS NOTIFICATION SCREEN -->
  <div class="success-screen" id="success-screen">
    <div class="success-icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2>Đã gửi ảnh thành công!</h2>
    <p>Màn hình máy tính đang nhận ảnh và tự động tìm kiếm sản phẩm tương đồng.</p>
    <button type="button" class="btn btn-send" onclick="retakePhoto()">Chụp thêm ảnh khác</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = (urlParams.get("session") || urlParams.get("s") || "default_session").toUpperCase();
    const displayEl = document.getElementById("session-display");
    if (displayEl) displayEl.textContent = "ID: " + sessionId.slice(-6);

    let currentStream = null;
    let currentFacingMode = "environment";
    let capturedDataUrl = "";
    let detectedCategory = "ao";

    // Khởi động
    initCameraPage();

    async function initCameraPage() {
      // Thử bật camera live stream (nếu được hỗ trợ và cấp quyền)
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          currentStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode, width: { ideal: 1280 } },
            audio: false
          });
          const video = document.getElementById("video-stream");
          video.srcObject = currentStream;
          video.style.display = "block";
          document.getElementById("fallback-box").style.display = "none";
          video.play().catch(() => { });
        } else {
          showFallbackView();
        }
      } catch (err) {
        showFallbackView();
      }
    }

    function showFallbackView() {
      const video = document.getElementById("video-stream");
      if (video) video.style.display = "none";
      const fb = document.getElementById("fallback-box");
      if (fb) fb.style.display = "flex";
      const hint = document.getElementById("camera-hint");
      if (hint) hint.textContent = "Bấm 'Chụp ảnh' để mở camera của máy";
    }

    function triggerNativeCamera() {
      const inp = document.getElementById("native-camera-input");
      if (inp) inp.click();
    }

    function triggerGallery() {
      const inp = document.getElementById("gallery-input");
      if (inp) inp.click();
    }

    function onMainShutterClick() {
      const video = document.getElementById("video-stream");
      if (currentStream && video && video.videoWidth > 0) {
        // Chụp trực tiếp từ video stream
        const canvas = document.getElementById("preview-canvas");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 640;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        capturedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
        showReview(capturedDataUrl, "ao");
      } else {
        // Mở native camera
        triggerNativeCamera();
      }
    }

    function handleFileSelected(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        capturedDataUrl = evt.target.result;
        let cat = "ao";
        const fn = (file.name || "").toLowerCase();
        if (/shoe|giay|sneaker/.test(fn)) cat = "giay";
        else if (/pant|quan|jean/.test(fn)) cat = "quan";
        showReview(capturedDataUrl, cat);
      };
      reader.readAsDataURL(file);
    }

    function snapSamplePreset(cat) {
      detectedCategory = cat;
      const presets = {
        ao: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=700&q=80",
        quan: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=700&q=80",
        giay: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"
      };
      capturedDataUrl = presets[cat] || presets.ao;
      showReview(capturedDataUrl, cat);
    }

    function showReview(imgSrc, cat) {
      detectedCategory = cat || "ao";
      document.getElementById("review-img").src = imgSrc;
      document.getElementById("review-overlay").style.display = "flex";
      const btn = document.getElementById("btn-send-to-pc");
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Gửi ảnh lên màn hình máy tính
        `;
      }
    }

    function retakePhoto() {
      document.getElementById("review-overlay").style.display = "none";
      document.getElementById("success-screen").style.display = "none";
      const inp1 = document.getElementById("native-camera-input");
      const inp2 = document.getElementById("gallery-input");
      if (inp1) inp1.value = "";
      if (inp2) inp2.value = "";
    }

    function switchCameraFacing() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      initCameraPage();
    }

    async function sendPhotoToDesktop() {
      const sendBtn = document.getElementById("btn-send-to-pc");
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.innerHTML = `<span> Đang gửi ảnh lên máy tính...</span>`;
      }

      const payload = {
        sessionId: sessionId,
        image: capturedDataUrl,
        category: detectedCategory,
        timestamp: Date.now()
      };

      // 1. Gửi qua Backend HTTP Relay để PC nhận được qua mạng LAN Wi-Fi
      try {
        const curHost = window.location.hostname || "localhost";
        const backendBase = urlParams.get("backend") || `http://${curHost}:8000`;
        const uploadUrl = `${backendBase}/api/v1/camera/upload/${sessionId}`;

        await fetch(uploadUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: capturedDataUrl, category: detectedCategory })
        });
      } catch (err) {
        console.warn("Lỗi gửi qua backend relay:", err);
      }

      // 2. BroadcastChannel (cho trường hợp test cùng trình duyệt máy tính)
      try {
        const bc = new BroadcastChannel("es_camera_sync");
        bc.postMessage(payload);
      } catch (e) { }

      // 3. LocalStorage
      try {
        localStorage.setItem("es_mobile_upload_" + sessionId, JSON.stringify(payload));
        localStorage.setItem("es_mobile_latest_event", JSON.stringify(payload));
      } catch (e) { }

      // Màn hình thành công
      document.getElementById("review-overlay").style.display = "none";
      document.getElementById("success-screen").style.display = "flex";
    }
  </script>
</body>

</html>
